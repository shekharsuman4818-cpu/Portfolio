<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body{
            background-color: aliceblue;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header{
            background-color: #222;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
          
        .logo{
            color: orange;
            font-size: 25px;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a{
            color: white;
            text-decoration: none;
        }

        nav a:hover{
            color: orange;
        }

        main{
            flex: 1;
            display: flex;
            justify-content: center;
           align-items: center;
           text-align: center;
           padding: 50px 20px;
        }

        .content h1{
            color: #222;
            margin-bottom: 15px;
        }

        .content p{
            color: gray;
            line-height: 1.6;
        }

        footer{
            background: #222;
            color: white;
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .links {
            display: flex;
            gap: 20px;
        }

        footer a{
            color: white;
            text-decoration: none;
        }

        @media(max-width:600px){

            header{
                flex-direction: column;
                text-align: center;
            }

            nav{
                flex-wrap: wrap;
                justify-content: center;
            }

            footer{
                flex-direction: column;
                text-align: center;
            }

            .links{
                justify-content: center;
                flex-wrap: wrap;
            }
        }
    </style>
    <header>
    <nav>
        <h2 class="logo">My Portfolio</h2>
        
            <a href="#">Home</a>
              <a href="#">About</a>
                <a href="#">Projects</a>
                  <a href="#">Contacts</a>
       
</nav>
</header>
<main>
        <div class="content">

            <h1>Welcome to My Portfolio</h1>
            <p>Hello I am a Web Developer.</p>
            <p>I love creating simple and beautiful websites.</p>
        </div>
</main>

    <footer>
        <p>2026 MyPortfolio.All Rigths Reserved.</p>

        <div class="links">
            <a href="#">Instagram</a>
            <a href="#">Linkdin</a>
            <a href="#">Github</a>
        </div>
    </footer>
</body>
</html>
